name: Build and Push

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: ./.github/actions/setup-nodeapp
        with:
          node-version: '26'
      
      - name: Run tests
        run: npm test
    
  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v7

      - name: Construir imagen de Docker
        run: docker build -t my-node-app:latest .
