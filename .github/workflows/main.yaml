name: Workflow App Node

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Preparar entorno node
        uses: ./.github/actions/setups-nodeapp
        with:
          node-version: 26
    
      - name: Correr tests
        run: npm test
